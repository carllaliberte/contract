name: Secret hygiene

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check-no-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan tree for secret anti-patterns
        run: bash scripts/check-no-secrets.sh
