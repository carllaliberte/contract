name: Agent Deliverable PR

# When a cloud agent pushes deliverable/* tag, open a PR to main automatically.
# Uses GITHUB_TOKEN — may bypass branch-creation rules that block integration tokens.

on:
  push:
    tags:
      - "deliverable/*"

permissions:
  contents: write
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create branch from tag
        id: branch
        run: |
          TAG="${GITHUB_REF_NAME}"
          BRANCH="cursor/${TAG#deliverable/}"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          git checkout -b "$BRANCH"
          git push -u origin "$BRANCH" || {
            echo "Branch push failed — trying force (tag is source of truth)"
            git push -u origin "$BRANCH" --force
          }

      - name: Open draft pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          BRANCH="cursor/${TAG#deliverable/}"
          EXISTING=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            echo "PR #$EXISTING already exists for $BRANCH"
            gh pr comment "$EXISTING" --body "Updated from tag \`$TAG\` (${GITHUB_SHA:0:7})"
            exit 0
          fi
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat(ios): App Store Pro IAP + submission pack (from $TAG)" \
            --body "Auto-opened by **Agent Deliverable PR** workflow from tag \`$TAG\`.

## Contents
- StoreKit 2 plugin + server IAP validation
- Privacy policy (FR/EN) + terms
- Apple Server Notifications webhook
- \`AGENTS.md\` + \`docs/APP_STORE_CONNECT.md\`

See \`AGENTS.md\` for agent handoff." \
            --draft
