name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "scripts/deploy-supabase-functions.sh"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Clapshot functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Add GitHub secret SUPABASE_ACCESS_TOKEN (Supabase Account → Access Tokens)."
            exit 1
          fi
          REF=ralxriqcpvuxzetnfsim
          supabase functions deploy generate-script --project-ref "$REF" --no-verify-jwt
          supabase functions deploy generate-poster --project-ref "$REF" --no-verify-jwt
          supabase functions deploy generate-clip --project-ref "$REF" --no-verify-jwt
          supabase functions deploy auth-apple --project-ref "$REF" --no-verify-jwt
          supabase functions deploy health --project-ref "$REF" --no-verify-jwt

      - name: Set xAI secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
        run: |
          if [ -z "$XAI_API_KEY" ]; then
            echo "Skip secrets: add GitHub secret XAI_API_KEY (xai-…) to wire Grok + Imagine."
            exit 0
          fi
          supabase secrets set \
            --project-ref ralxriqcpvuxzetnfsim \
            "XAI_API_KEY=${XAI_API_KEY}" \
            "XAI_MODEL=grok-4.5" \
            "XAI_IMAGE_MODEL=grok-imagine-image-2.0" \
            "XAI_VIDEO_MODEL=grok-imagine-video-1.5"
