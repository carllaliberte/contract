# Mega-Giga passage diagnostic (Maximum-First / PR #715 alignment)
#
# Priority path:
#   GitHub Actions → RUNNER_REACHED → head SHA asserted
#   → STOP → secret → HOLD_HUMAN → provider → receipt
# MEASURED only when the adapter used global fetch and HTTP succeeded.
# HOLD_HUMAN refuses the call unless PASSAGE_HUMAN_AUTHORIZATION=yes.
#
# This is NOT an Acorn Cortex, NOT LIVE, NOT a second runtime.
# Runner failure and application/OpenAI failure are separate jobs.
# No continue-on-error. No synthetic RUNNER_REACHED without a step.
#
# Absolute target remains carllaliberte/Acorn-Global when reachable.
# This workflow lands on the reachable execution surface to repair the passage.

name: Passage runner → OpenAI MEASURED

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/passage-runner-openai.yml"
      - "scripts/passage/**"
      - "docs/passage/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/passage-runner-openai.yml"
      - "scripts/passage/**"
      - "docs/passage/**"

permissions:
  contents: read

concurrency:
  group: passage-runner-openai-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # PHASE: RUNNER_REACHED (absolute priority)
  # No checkout. No npm. No node project. No OpenAI. No deployment.
  # -------------------------------------------------------------------------
  runner_reach:
    name: RUNNER_REACHED
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      reached: ${{ steps.reach.outputs.reached }}
    steps:
      - name: RUNNER_REACHED
        id: reach
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [ "${GITHUB_SHA}" = "${HEAD_SHA}" ]; then
            SHA_RELATION="github_sha_equals_head"
          else
            SHA_RELATION="github_sha_differs_from_head"
          fi
          echo "RUNNER_REACHED=true"
          echo "runner_os=${RUNNER_OS}"
          echo "runner_arch=${RUNNER_ARCH}"
          echo "event_name=${EVENT_NAME}"
          echo "github_sha=${GITHUB_SHA}"
          echo "head_sha=${HEAD_SHA}"
          echo "sha_relation=${SHA_RELATION}"
          echo "github_run_id=${GITHUB_RUN_ID}"
          echo "timestamp=${TS}"
          uname -a
          {
            echo "### RUNNER_REACHED proof"
            echo ""
            echo '```'
            echo "RUNNER_REACHED=true"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "event_name=${EVENT_NAME}"
            echo "github_sha=${GITHUB_SHA}"
            echo "head_sha=${HEAD_SHA}"
            echo "sha_relation=${SHA_RELATION}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "timestamp=${TS}"
            echo '```'
            echo ""
            echo "On pull_request, github.sha is the synthetic merge commit."
            echo "Tests must run on head_sha. A push to main that does not touch"
            echo "scripts/passage, docs/passage, or this workflow file does not start this workflow."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "reached=true" >> "$GITHUB_OUTPUT"

  # -------------------------------------------------------------------------
  # PHASE: OpenAI AFTER runner (application layer — distinct failure class)
  # -------------------------------------------------------------------------
  openai_measure:
    name: OpenAI MEASURED
    needs: runner_reach
    if: needs.runner_reach.result == 'success' && needs.runner_reach.outputs.reached == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout passage scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Assert tested SHA is the head SHA
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "expected_sha=${EXPECTED_SHA}"
          echo "tested_sha=${ACTUAL}"
          echo "github_sha=${GITHUB_SHA}"
          if [ "${ACTUAL}" != "${EXPECTED_SHA}" ]; then
            echo "::error::tested SHA ${ACTUAL} != expected head SHA ${EXPECTED_SHA}"
            exit 1
          fi

      - name: Setup Node (passage probe only)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Passage unit tests (no network OpenAI)
        run: node --test scripts/passage/*.test.mjs

      - name: OpenAI secret presence (yes/no only)
        id: secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            echo "openai_secret_present=yes"
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "openai_secret_present=no"
            echo "present=no" >> "$GITHUB_OUTPUT"
            echo "::error::OPENAI_SECRET_MISSING — application failure (runner already reached)"
            exit 2
          fi

      - name: OpenAI request → response → measure → receipt
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PASSAGE_STOP: ${{ vars.PASSAGE_STOP }}
          PASSAGE_HUMAN_AUTHORIZATION: ${{ vars.PASSAGE_HUMAN_AUTHORIZATION }}
        run: |
          set -euo pipefail
          node scripts/passage/openai-probe.mjs | tee passage-openai.log
          {
            echo "### OpenAI MEASURED receipt"
            echo ""
            echo '```json'
            sed -n '/RECEIPT_BEGIN/,/RECEIPT_END/p' passage-openai.log | sed '1d;$d'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
