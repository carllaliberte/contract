name: CI CreatorFlow

on:
  push:
    branches: [main]
    paths:
      - "creatorflow/**"
      - "shared/**"
      - ".github/workflows/ci-creatorflow.yml"
  pull_request:
    paths:
      - "creatorflow/**"
      - "shared/**"
      - ".github/workflows/ci-creatorflow.yml"
  workflow_dispatch:

concurrency:
  group: ci-creatorflow-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

permissions:
  contents: read

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creatorflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Typecheck
        run: npm run typecheck

      - name: Verify iOS ATS (no arbitrary loads)
        run: |
          PLIST=ios/App/App/Info.plist
          if grep -q '<key>NSAllowsArbitraryLoads</key>' "$PLIST"; then
            if grep -A1 '<key>NSAllowsArbitraryLoads</key>' "$PLIST" | grep -q '<true/>'; then
              echo "ERROR: NSAllowsArbitraryLoads must not be true in Info.plist"
              exit 1
            fi
          fi
          echo "ATS check passed"

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Playwright e2e
        run: npm run test:e2e

  deploy-preview:
    needs: web
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: creatorflow
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Install deps & Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build CreatorFlow preview (SEO prerender)
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /contract/creatorflow/pr-${{ github.event.pull_request.number }}/
          VITE_ROUTER_BASENAME: /contract/creatorflow/pr-${{ github.event.pull_request.number }}
        run: npm run build:seo

      - name: Publish preview to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          npx gh-pages@6.3.0 -d dist \
            --dest "creatorflow/pr-${{ github.event.pull_request.number }}" \
            --add \
            -m "Preview CreatorFlow PR #${{ github.event.pull_request.number }} [skip ci]" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/carllaliberte/contract.git"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://carllaliberte.github.io/contract/creatorflow/pr-${context.payload.pull_request.number}/`;
            const marker = '<!-- creatorflow-preview -->';
            const body = `${marker}\n**CreatorFlow preview:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

      - name: Preview URL
        run: echo "https://carllaliberte.github.io/contract/creatorflow/pr-${{ github.event.pull_request.number }}/"

  android:
    needs: web
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: creatorflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build web and sync Android
        run: npm ci && npm run build:android

      - name: Assemble debug APK
        working-directory: creatorflow/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: creatorflow-debug-apk
          path: creatorflow/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  ios:
    needs: web
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: creatorflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Build web and sync iOS
        run: npm ci && npm run build:ios

      - name: Verify iOS ATS (no arbitrary loads)
        run: |
          PLIST=ios/App/App/Info.plist
          if grep -q '<key>NSAllowsArbitraryLoads</key>' "$PLIST"; then
            if grep -A1 '<key>NSAllowsArbitraryLoads</key>' "$PLIST" | grep -q '<true/>'; then
              echo "ERROR: NSAllowsArbitraryLoads must not be true in Info.plist"
              exit 1
            fi
          fi
          echo "ATS check passed"

      - name: Build for iOS Simulator
        working-directory: creatorflow/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
