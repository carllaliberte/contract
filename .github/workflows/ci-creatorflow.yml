name: CI Clapshot

on:
  push:
    branches: [main]
    paths:
      - "creatorflow/**"
      - "shared/**"
      - ".github/workflows/ci-creatorflow.yml"
  pull_request:
    paths:
      - "creatorflow/**"
      - "shared/**"
      - ".github/workflows/ci-creatorflow.yml"
  workflow_dispatch:

concurrency:
  group: ci-creatorflow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creatorflow

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright e2e
        run: npm run test:e2e

  deploy-preview:
    needs: web
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    defaults:
      run:
        working-directory: creatorflow
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Install deps & Playwright Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build Clapshot preview
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: /contract/clapshot/pr-${{ github.event.pull_request.number }}/
          VITE_ROUTER_BASENAME: /contract/clapshot/pr-${{ github.event.pull_request.number }}
        run: npm run build:seo

      - name: Publish preview to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          npx gh-pages@6.3.0 -d dist \
            --dest "clapshot/pr-${{ github.event.pull_request.number }}" \
            --add \
            -m "Preview Clapshot PR #${{ github.event.pull_request.number }} [skip ci]" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/carllaliberte/contract.git"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://carllaliberte.github.io/contract/clapshot/pr-${{ github.event.pull_request.number }}/`;
            const marker = '<!-- clapshot-preview -->';
            const body = `${marker}\n**Clapshot preview:** ${url}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }

  android:
    needs: web
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: creatorflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Build web and sync Android
        run: npm ci && npm run build:android
      - name: Assemble debug APK
        working-directory: creatorflow/android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    needs: web
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: creatorflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json
      - name: Build web and sync iOS
        run: npm ci && npm run build:ios
      - name: Build for iOS Simulator
        working-directory: creatorflow/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
