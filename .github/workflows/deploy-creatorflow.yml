name: Deploy CreatorFlow

on:
  push:
    branches: [main]
    paths:
      - "creatorflow/**"
      - "shared/**"
      - ".github/workflows/deploy-creatorflow.yml"
  workflow_run:
    workflows: ["CI CreatorFlow"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-creatorflow-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request'
      )
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Build CreatorFlow
        working-directory: creatorflow
        env:
          VITE_BASE_PATH: /contract/creatorflow/
          VITE_ROUTER_BASENAME: /contract/creatorflow
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://creatorflow-api.fly.dev' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm ci && npm run build

      - name: Require index + privacy
        working-directory: creatorflow
        run: |
          test -f dist/index.html
          test -f dist/privacy.html

      - name: Optional SEO prerender (must not block Pages)
        working-directory: creatorflow
        continue-on-error: true
        env:
          VITE_BASE_PATH: /contract/creatorflow/
          PRERENDER_TIMEOUT_MS: "45000"
          NODE_OPTIONS: --max-old-space-size=192
          UV_THREADPOOL_SIZE: "2"
        run: node scripts/prerender.mjs

      - name: Publish to gh-pages/creatorflow
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: creatorflow/dist
          destination_dir: creatorflow
          keep_files: true
          commit_message: Deploy CreatorFlow [skip ci]
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Live URLs
        run: |
          echo "App: https://carllaliberte.github.io/contract/creatorflow/"
          echo "Privacy: https://carllaliberte.github.io/contract/creatorflow/privacy.html"

  deploy-pr-preview:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: write
      pull-requests: write
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Resolve PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.workflow_run.head_sha,
            });
            const pr = prs[0];
            if (!pr) {
              core.setFailed('No pull request found for CI run');
              return;
            }
            core.setOutput('number', String(pr.number));

      - name: Download PR preview artifact
        uses: actions/github-script@v7
        env:
          PREVIEW_DIST_DIR: ${{ runner.temp }}/creatorflow-pr-preview-dist
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { execSync } = require('child_process');
            const destDir = process.env.PREVIEW_DIST_DIR;
            fs.mkdirSync(destDir, { recursive: true });

            const { data: artifacts } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const match = artifacts.artifacts.find((artifact) => artifact.name === 'creatorflow-pr-preview-dist');
            if (!match) {
              core.setFailed('creatorflow-pr-preview-dist artifact not found');
              return;
            }

            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: 'zip',
            });
            const zipPath = path.join(destDir, 'artifact.zip');
            fs.writeFileSync(zipPath, Buffer.from(download.data));
            execSync(`unzip -q ${zipPath} -d ${destDir}`);
            fs.unlinkSync(zipPath);
            core.setOutput('dist_dir', destDir);

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Publish PR preview to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIEW_DIST_DIR: ${{ runner.temp }}/creatorflow-pr-preview-dist
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          npx gh-pages@6.3.0 -d "$PREVIEW_DIST_DIR" \
            --dest "creatorflow/pr-${{ steps.pr.outputs.number }}" \
            --add \
            -m "Deploy CreatorFlow PR preview #${{ steps.pr.outputs.number }} [skip ci]" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/carllaliberte/contract.git"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = Number('${{ steps.pr.outputs.number }}');
            const previewUrl = `https://carllaliberte.github.io/contract/creatorflow/pr-${prNumber}/`;
            const marker = '<!-- creatorflow-pr-preview -->';
            const body = `${marker}\n**CreatorFlow PR preview:** ${previewUrl}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

      - name: Preview URL
        run: echo "https://carllaliberte.github.io/contract/creatorflow/pr-${{ steps.pr.outputs.number }}/"
