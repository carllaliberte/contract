name: Deploy CreatorFlow

on:
  workflow_run:
    workflows: ["CI CreatorFlow"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-creatorflow
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Install deps & Playwright Chromium
        working-directory: creatorflow
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Build CreatorFlow (SEO prerender)
        working-directory: creatorflow
        env:
          # GitHub → Settings → Variables (required for live API on Pages):
          # VITE_API_URL=https://TON-PROJET.supabase.co/functions/v1/generate-script
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_AUTH_APPLE_URL: ${{ vars.VITE_AUTH_APPLE_URL }}
          VITE_BASE_PATH: /contract/creatorflow/
          VITE_ROUTER_BASENAME: /contract/creatorflow
        run: npm run build:seo

      - name: Publish to gh-pages/creatorflow (keep META dashboard at root)
        working-directory: creatorflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          npx gh-pages@6.3.0 -d dist \
            --dest creatorflow \
            --add \
            -m "Deploy CreatorFlow [skip ci]" \
            -r "https://x-access-token:${GITHUB_TOKEN}@github.com/carllaliberte/contract.git"

      - name: Live URL
        run: echo "https://carllaliberte.github.io/contract/creatorflow/"
