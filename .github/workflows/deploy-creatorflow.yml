name: Deploy CreatorFlow

on:
  push:
    branches: [main]
    paths:
      - "creatorflow/**"
      - "shared/**"
      - ".github/workflows/deploy-creatorflow.yml"
  workflow_run:
    workflows: ["CI CreatorFlow"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-creatorflow
  cancel-in-progress: false

jobs:
  deploy-github-pages:
    timeout-minutes: 12
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Build CreatorFlow (SEO prerender)
        working-directory: creatorflow
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: /contract/creatorflow/
          VITE_ROUTER_BASENAME: /contract/creatorflow
        run: npm ci && npm run build:seo

      - name: Verify dist artifacts
        working-directory: creatorflow
        run: test -f dist/index.html && test -f dist/privacy.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: creatorflow/dist
          destination_dir: creatorflow
          keep_files: true
          commit_message: Deploy CreatorFlow [skip ci]

      - name: Live URLs
        run: |
          echo "App: https://carllaliberte.github.io/contract/creatorflow/"
          echo "Privacy: https://carllaliberte.github.io/contract/creatorflow/privacy.html"
