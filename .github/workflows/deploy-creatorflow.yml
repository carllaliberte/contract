name: Deploy CreatorFlow

on:
  push:
    branches: [main]
    paths:
      - "creatorflow/**"
      - "shared/**"
      - ".github/workflows/deploy-creatorflow.yml"
  workflow_run:
    workflows: ["CI CreatorFlow"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-creatorflow
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.event != 'pull_request'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Build CreatorFlow
        working-directory: creatorflow
        env:
          VITE_BASE_PATH: /contract/creatorflow/
          VITE_ROUTER_BASENAME: /contract/creatorflow
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://creatorflow-api.fly.dev' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm ci && npm run build

      - name: Require index + privacy
        working-directory: creatorflow
        run: |
          test -f dist/index.html
          test -f dist/privacy.html

      - name: Optional SEO prerender (must not block Pages)
        working-directory: creatorflow
        continue-on-error: true
        env:
          VITE_BASE_PATH: /contract/creatorflow/
          PRERENDER_TIMEOUT_MS: "45000"
          NODE_OPTIONS: --max-old-space-size=192
          UV_THREADPOOL_SIZE: "2"
        run: node scripts/prerender.mjs

      - name: Publish to gh-pages/creatorflow
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: creatorflow/dist
          destination_dir: creatorflow
          keep_files: true
          commit_message: Deploy CreatorFlow [skip ci]
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Live URLs
        run: |
          echo "App: https://carllaliberte.github.io/contract/creatorflow/"
          echo "Privacy: https://carllaliberte.github.io/contract/creatorflow/privacy.html"

