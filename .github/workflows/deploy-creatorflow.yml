name: Deploy CreatorFlow

on:
  push:
    branches: [main]
    paths:
      - "creatorflow/**"
      - "shared/**"
      - ".github/workflows/deploy-creatorflow.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-creatorflow
  cancel-in-progress: false

jobs:
  deploy-github-pages:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Build CreatorFlow
        working-directory: creatorflow
        env:
          VITE_BASE_PATH: /contract/creatorflow/
          VITE_ROUTER_BASENAME: /contract/creatorflow
          VITE_API_URL: ${{ vars.VITE_API_URL || 'https://ralxriqcpvuxzetnfsim.supabase.co/functions/v1/generate-script' }}
          VITE_AUTH_APPLE_URL: ${{ vars.VITE_AUTH_APPLE_URL || 'https://ralxriqcpvuxzetnfsim.supabase.co/functions/v1/auth-apple' }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ralxriqcpvuxzetnfsim.supabase.co' }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhbHhyaXFjcHZ1eHpldG5mc2ltIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc4NTAzMTAsImV4cCI6MjEwMzQyNjMxMH0.z-HLyxSKfOpgtCOeH7Dk_3pcm0K9Af1Tdzkac7mQhnU' }}
        run: npm ci && npm run build

      - name: Require index + privacy
        working-directory: creatorflow
        run: |
          test -f dist/index.html
          test -f dist/privacy.html

      - name: Optional SEO prerender (must not block Pages)
        working-directory: creatorflow
        continue-on-error: true
        env:
          VITE_BASE_PATH: /contract/creatorflow/
          PRERENDER_TIMEOUT_MS: "45000"
          NODE_OPTIONS: --max-old-space-size=192
          UV_THREADPOOL_SIZE: "2"
        run: node scripts/prerender.mjs

      - name: Publish to gh-pages/creatorflow
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: creatorflow/dist
          destination_dir: creatorflow
          keep_files: true
          commit_message: Deploy CreatorFlow [skip ci]
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com

      - name: Live URLs
        run: |
          echo "App: https://carllaliberte.github.io/contract/creatorflow/"
          echo "Privacy: https://carllaliberte.github.io/contract/creatorflow/privacy.html"
