name: Deploy META dashboard

on:
  push:
    branches: [main]
    paths:
      - 'google-app/**'
      - 'meta.sol'
      - '.github/workflows/deploy-meta-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-meta-dashboard
  cancel-in-progress: true

jobs:
  deploy-github-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: google-app/package-lock.json

      - name: Install and build for GitHub Pages
        working-directory: google-app
        env:
          VITE_BASE_PATH: /contract/
        run: |
          npm ci
          npm run generate-icons
          if [ -f deployment.json ]; then
            export VITE_CONTRACT_ADDRESS=$(node -pe "JSON.parse(require('fs').readFileSync('deployment.json')).contractAddress")
            export VITE_RPC_URL=$(node -pe "JSON.parse(require('fs').readFileSync('deployment.json')).rpcUrl")
          fi
          npm run build:pages

      - name: Publish to gh-pages branch
        working-directory: google-app
        run: npx gh-pages -d dist -m "Deploy META dashboard [skip ci]"

      - name: Pages setup reminder
        run: |
          echo "Published to gh-pages branch."
          echo "Enable GitHub Pages: Settings → Pages → Branch gh-pages / (root)"
          echo "Live URL: https://carllaliberte.github.io/contract/"

  firebase-hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: google-app/package-lock.json

      - name: Build for Firebase
        working-directory: google-app
        run: |
          npm ci
          if [ -f deployment.json ]; then
            export VITE_CONTRACT_ADDRESS=$(node -pe "JSON.parse(require('fs').readFileSync('deployment.json')).contractAddress")
            export VITE_RPC_URL=$(node -pe "JSON.parse(require('fs').readFileSync('deployment.json')).rpcUrl")
          fi
          npm run build

      - name: Deploy Firebase Hosting
        working-directory: google-app
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN not set — skipping Firebase Hosting"
            exit 0
          fi
          npx firebase deploy --only hosting --project carllaliberte-meta-dashboard --non-interactive
