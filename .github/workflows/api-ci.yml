name: API CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "supabase/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    paths:
      - "api/**"
      - "supabase/**"
      - ".github/workflows/api-ci.yml"

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        env:
          MEMORY_STORE: "true"
          MOCK_LLM: "true"
        run: npm run test

      - name: Build
        run: npm run build
