name: CI

on:
  push:
    branches: [main]
    paths:
      - "creatorflow/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "creatorflow/**"
      - ".github/workflows/ci.yml"

concurrency:
  group: ci-creatorflow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  creatorflow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: creatorflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run CI (typecheck, unit tests, build, e2e)
        run: npm run ci
