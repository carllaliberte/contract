name: iOS App Store release

# "Virtual Mac" — runs on GitHub-hosted macOS runners (macos-latest).
# Trigger: push tag ios-release/* OR manual dispatch.

on:
  workflow_dispatch:
    inputs:
      vite_api_url:
        description: "VITE_API_URL for production build"
        required: false
        default: ""
  push:
    tags:
      - "ios-release/*"
      - "deliverable/app-store-*"

permissions:
  contents: read

jobs:
  macos-virtual:
    name: macOS virtual builder
    runs-on: macos-latest
    defaults:
      run:
        working-directory: creatorflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: System info (virtual Mac)
        run: |
          sw_vers
          xcodebuild -version
          echo "Runner: GitHub-hosted macOS (virtual Mac for iOS builds)"

      - name: Build web and sync iOS
        env:
          VITE_API_URL: ${{ github.event.inputs.vite_api_url || vars.VITE_API_URL || '' }}
        run: |
          npm ci
          unset VITE_AUTH_STUB || true
          npm run build:ios

      - name: Simulator build (always — proves Xcode compiles)
        working-directory: creatorflow/ios/App
        run: |
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO

      - name: Import signing certificate
        if: ${{ secrets.APPLE_CERTIFICATE_BASE64 != '' }}
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN"

      - name: Install provisioning profile
        if: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 != '' }}
        env:
          APPLE_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISION_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$APPLE_PROVISION_PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin <<< "$(security cms -D -i "$RUNNER_TEMP/profile.mobileprovision")")
          cp "$RUNNER_TEMP/profile.mobileprovision" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID.mobileprovision"

      - name: Decode App Store Connect API key
        if: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8

      - name: Archive + upload to App Store Connect
        if: ${{ secrets.APPLE_TEAM_ID != '' }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          export APP_STORE_CONNECT_API_KEY_PATH="$HOME/.private_keys/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          bash ../scripts/ios-archive-and-upload.sh

      - name: Secrets missing — instructions
        if: ${{ secrets.APPLE_TEAM_ID == '' }}
        run: |
          echo "::warning::APPLE_TEAM_ID secret not configured — archive/upload skipped."
          echo "Add GitHub secrets: APPLE_TEAM_ID, APP_STORE_CONNECT_API_KEY_ID,"
          echo "APP_STORE_CONNECT_API_ISSUER_ID, APP_STORE_CONNECT_API_KEY_BASE64"
          echo "Then re-run this workflow or push tag ios-release/1.0.0"

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatorflow-ios-ipa
          path: creatorflow/ios/build/export/*.ipa
          if-no-files-found: ignore

      - name: Upload xcarchive artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: creatorflow-ios-xcarchive
          path: creatorflow/ios/build/CreatorFlow.xcarchive
          if-no-files-found: ignore
