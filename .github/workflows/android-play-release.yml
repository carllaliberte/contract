name: Build Android release (Google Play)

on:
  push:
    branches: [main]
    paths:
      - 'google-app/**'
      - '.github/workflows/android-play-release.yml'
  workflow_dispatch:

permissions:
  contents: read

# Secrets: ANDROID_KEYSTORE_* and GOOGLE_PLAY_SERVICE_ACCOUNT_JSON (repo Settings → Actions)

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: google-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and build web + Android
        working-directory: google-app
        run: |
          npm ci
          npm run generate-icons
          if [ -f deployment.json ]; then
            export VITE_CONTRACT_ADDRESS=$(node -pe "JSON.parse(require('fs').readFileSync('deployment.json')).contractAddress")
            export VITE_RPC_URL=$(node -pe "JSON.parse(require('fs').readFileSync('deployment.json')).rpcUrl")
          fi
          npm run build:android
          npx cap sync android

      - name: Verify GitHub Actions secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!name}" ]; then
              echo "::warning::GitHub secret $name is not set (repo Settings → Secrets → Actions)"
              missing=$((missing + 1))
            else
              echo "OK: $name is set"
            fi
          done
          if [ "$missing" -gt 0 ]; then
            echo ""
            echo "Add repository secrets: https://github.com/carllaliberte/contract/settings/secrets/actions"
            echo "Cursor Environment secrets do NOT flow to GitHub Actions."
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              echo "::error::Missing $missing secret(s) — signed build and Play upload skipped"
              exit 1
            fi
          fi

      - name: Decode signing keystore
        working-directory: google-app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
          else
            echo "ANDROID_KEYSTORE_BASE64 not set — unsigned build"
          fi

      - name: Build release AAB
        working-directory: google-app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -f release.keystore ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=$PWD/release.keystore \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            echo "ANDROID_KEYSTORE_BASE64 not set — building unsigned bundle"
            ./gradlew bundleRelease
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-dashboard-aab
          path: google-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Check Play upload credentials
        id: play_upload
        env:
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$PLAY_JSON" ] && [ -n "$KEYSTORE_B64" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            if [ -z "$KEYSTORE_B64" ]; then
              echo "ANDROID_KEYSTORE_BASE64 not set — Play requires a signed AAB"
            fi
            if [ -z "$PLAY_JSON" ]; then
              echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON not set — skipping Play upload"
            fi
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play (internal testing)
        if: steps.play_upload.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.carllaliberte.meta
          releaseFiles: google-app/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
