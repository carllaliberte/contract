name: Build Android release (Google Play)

on:
  push:
    branches: [main]
    paths:
      - 'google-app/**'
      - '.github/workflows/android-play-release.yml'
      - 'scripts/load-meta-play-config.cjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: google-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Load META_PLAY_CONFIG (one secret)
        id: play_config
        env:
          META_PLAY_CONFIG: ${{ secrets.META_PLAY_CONFIG }}
        run: node scripts/load-meta-play-config.cjs

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install and build web + Android
        working-directory: google-app
        run: |
          npm ci
          npm run generate-icons
          if [ -f deployment.json ]; then
            export VITE_CONTRACT_ADDRESS=$(node -pe "JSON.parse(require('fs').readFileSync('deployment.json')).contractAddress")
            export VITE_RPC_URL=$(node -pe "JSON.parse(require('fs').readFileSync('deployment.json')).rpcUrl")
          fi
          npm run build:android
          npx cap sync android

      - name: Decode signing keystore (legacy secrets)
        if: steps.play_config.outputs.loaded != 'true'
        working-directory: google-app/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.keystore
            {
              echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=${ANDROID_KEY_ALIAS:-meta-upload}"
              echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
              echo "GOOGLE_PLAY_SERVICE_ACCOUNT_JSON=$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"
            } >> "$GITHUB_ENV"
          else
            echo "No legacy keystore secret"
          fi

      - name: Build release AAB
        working-directory: google-app/android
        run: |
          if [ -f release.keystore ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ]; then
            ./gradlew bundleRelease \
              -Pandroid.injected.signing.store.file=$PWD/release.keystore \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="${ANDROID_KEY_ALIAS:-meta-upload}" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            echo "Building unsigned bundle — add secret META_PLAY_CONFIG"
            ./gradlew bundleRelease
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: meta-dashboard-aab
          path: google-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Check Play upload credentials
        id: play_upload
        run: |
          if [ -f google-app/android/release.keystore ] && [ -n "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "Play upload skipped — add one secret META_PLAY_CONFIG"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play (internal testing)
        if: steps.play_upload.outputs.enabled == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.carllaliberte.meta
          releaseFiles: google-app/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed

      - name: Publish signed AAB to GitHub Release (manual Play fallback)
        if: steps.play_upload.outputs.enabled != 'true' && steps.play_config.outputs.loaded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAB="$(ls -1 google-app/android/app/build/outputs/bundle/release/*.aab | head -1)"
          gh release create "play-internal-$(date +%Y%m%d-%H%M)" \
            --repo "${{ github.repository }}" \
            --title "META Dashboard AAB (signed)" \
            --notes "AAB signé. Play Console → Testing → Internal → Upload." \
            "$AAB"
