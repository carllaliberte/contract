name: Orchestrate Clapshot

on:
  workflow_dispatch:
    inputs:
      pipeline:
        description: Pipeline to run
        type: choice
        options:
          - ci
          - deploy
          - ci-and-deploy
        default: ci-and-deploy
      ref:
        description: Branch, tag, or SHA
        required: true
        default: main

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch CI Clapshot
        if: inputs.pipeline == 'ci' || inputs.pipeline == 'ci-and-deploy'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-creatorflow.yml',
              ref: '${{ inputs.ref }}',
            });
            core.info(`Dispatched CI Clapshot on ref ${'${{ inputs.ref }}'}`);

      - name: Dispatch Deploy Clapshot
        if: inputs.pipeline == 'deploy'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy-creatorflow.yml',
              ref: '${{ inputs.ref }}',
            });
            core.info(`Dispatched Deploy Clapshot on ref ${'${{ inputs.ref }}'}`);

      - name: ci-and-deploy note
        if: inputs.pipeline == 'ci-and-deploy'
        run: |
          echo "CI Clapshot dispatched on ref ${{ inputs.ref }}."
          echo "Deploy Clapshot will run automatically after CI succeeds on main (workflow_run)."
