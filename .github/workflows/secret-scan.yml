name: Secret scan (TruffleHog)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Action always passes --fail; do not also put --fail in extra_args
      # (trufflehog rejects repeated --fail).
      - name: TruffleHog (push / PR)
        if: github.event_name != 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@v3.88.29
        with:
          path: ./
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-exclude

      - name: TruffleHog (manual full branch)
        if: github.event_name == 'workflow_dispatch'
        uses: trufflesecurity/trufflehog@v3.88.29
        with:
          path: ./
          base: ""
          head: ${{ github.ref_name }}
          extra_args: --results=verified,unknown --exclude-paths=.trufflehog-exclude
