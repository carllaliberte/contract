name: Archive iOS (App Store 1.0)

# Manual archive + TestFlight upload on GitHub-hosted macOS.
# Requires four repository secrets — see docs/IOS_ARCHIVE_GHA.md.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: archive-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  archive:
    name: Archive CreatorFlow 1.0
    runs-on: macos-latest

    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
      BUNDLE_ID: com.carllaliberte.creatorflow

    steps:
      - name: Verify required secrets
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          missing=()
          for name in APPLE_TEAM_ID APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_BASE64; do
            eval "val=\$$name"
            if [ -z "$val" ]; then
              missing+=("$name")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add all four secrets before running this workflow. See docs/IOS_ARCHIVE_GHA.md"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: creatorflow/package-lock.json

      - name: Build web assets and sync Capacitor iOS
        working-directory: creatorflow
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          npm ci
          unset VITE_AUTH_STUB || true
          npm run build:ios

      - name: Install App Store Connect API key
        id: api_key
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          KEY_DIR="$HOME/.private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Archive iOS app (signed via API key)
        working-directory: creatorflow/ios/App
        run: |
          xcodebuild archive \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath "$PWD/build/App.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates

      - name: Export App Store IPA
        working-directory: creatorflow/ios/App
        run: |
          EXPORT_OPTS="$RUNNER_TEMP/ExportOptions.plist"
          rm -f "$EXPORT_OPTS"
          /usr/libexec/PlistBuddy -c "Add :method string app-store-connect" "$EXPORT_OPTS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$EXPORT_OPTS"
          /usr/libexec/PlistBuddy -c "Add :signingStyle string automatic" "$EXPORT_OPTS"
          /usr/libexec/PlistBuddy -c "Add :uploadSymbols bool true" "$EXPORT_OPTS"
          xcodebuild -exportArchive \
            -archivePath "$PWD/build/App.xcarchive" \
            -exportPath "$PWD/build/export" \
            -exportOptionsPlist "$EXPORT_OPTS" \
            -allowProvisioningUpdates

      - name: Upload to App Store Connect (altool)
        working-directory: creatorflow/ios/App
        run: |
          IPA="$(find build/export -maxdepth 1 -name '*.ipa' | head -1)"
          if [ -z "$IPA" ]; then
            echo "::error::IPA not found in build/export"
            exit 1
          fi
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$APP_STORE_CONNECT_API_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_API_ISSUER_ID"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: creatorflow-ios-1.0-ipa
          path: creatorflow/ios/App/build/export/*.ipa
          retention-days: 14
          if-no-files-found: error

      - name: Wipe App Store Connect API key (.p8)
        if: always() && steps.api_key.outputs.path != ''
        run: |
          rm -f "${{ steps.api_key.outputs.path }}"
          rmdir "$HOME/.private_keys" 2>/dev/null || true
          echo "API key file removed from runner."
