version: 2
updates:
  - package-ecosystem: npm
    directory: /creatorflow
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      capacitor:
        patterns:
          - "@capacitor/*"
          - "@capacitor-community/*"
      dev-dependencies:
        dependency-type: development
        patterns:
          - "*"

  # google-app / META is archived. Do not reopen a second Dependabot lane.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
