# Render Blueprint — CreatorFlow API
# https://render.com/docs/blueprint-spec
#
# Deploy: Render Dashboard → New → Blueprint → connect carllaliberte/contract
# Live URL: https://creatorflow-api.onrender.com

services:
  - type: web
    name: creatorflow-api
    runtime: node
    plan: free
    region: oregon
    rootDir: api
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CORS_ORIGINS
        value: https://carllaliberte.github.io,http://localhost:5173
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: MONTHLY_AI_LIMIT
        value: "8"
      - key: MONTHLY_AI_LIMIT_PRO
        value: "200"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
